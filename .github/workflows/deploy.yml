name: Deploy a Cloud Run

# Pipeline de despliegue (docs/architecture/README.md sec. 4). Separado de
# ci.yml a proposito: CI corre siempre (cada push/PR), esto solo intenta
# desplegar cuando ya paso CI y hay algo real que subir.
#
# Politica de gatillos (segun el diseño original de README.md sec. 4,
# adaptada a un solo proyecto GCP real - cyp-cumbres-461220 - en vez de 3
# proyectos por ambiente, ver docs/architecture/infraestructura-gcp/):
#   - push a main -> despliega a dev (sufijo "-dev" en cada servicio).
#   - tag "vN-faseX" -> despliega a staging (sufijo "-staging").
#   - staging + aprobacion manual (environment protection en GitHub) -> prod.
#
# Requiere que YA EXISTAN (ver scripts/gcp_setup.sh, se corre UNA SOLA VEZ
# a mano por alguien con acceso a gcloud - este workflow no crea infra,
# solo construye/sube/despliega sobre lo que scripts/gcp_setup.sh ya creo):
#   - Artifact Registry: cyp-cumbres-461220/cumbresbi
#   - Workload Identity Federation (WIF) para autenticar GitHub Actions sin
#     llave JSON estatica (mas seguro - ver "Configurar WIF" en el script)
#   - Un service account de despliegue con permisos de
#     roles/run.admin + roles/iam.serviceAccountUser + roles/artifactregistry.writer
#   - Los secrets del repo de GitHub:
#       GCP_PROJECT_ID, GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOY_SA_EMAIL,
#       GCP_REGION, GATEWAY_URL_DEV (15/Sep/2026: ya no se hornea en build
#       time - se pasa como env var de runtime GATEWAY_INTERNAL_URL al
#       frontend, ver next.config.js), GOOGLE_PICKER_CLIENT_ID,
#       GOOGLE_PICKER_API_KEY (17/Sep/2026: estos si son build-arg del
#       frontend, ver frontend/Dockerfile - si faltan, el build sigue
#       igual, solo el selector de carpetas de Drive queda deshabilitado)

on:
  push:
    branches: ["main"]
    tags: ["v*-fase*"]
  workflow_dispatch: {} # permite disparar un deploy manual desde la UI de Actions

permissions:
  contents: read
  id-token: write # requerido por Workload Identity Federation (sin llave JSON)

env:
  REGION: ${{ secrets.GCP_REGION }}
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  AR_REPO: cumbresbi
  # Sufijo de ambiente segun el gatillo - ver politica arriba. workflow_dispatch
  # (deploy manual) tambien va a dev, es el caso mas comun de "probar algo ya".
  ENV_SUFFIX: ${{ (startsWith(github.ref, 'refs/tags/v') && 'staging') || 'dev' }}

jobs:
  # Deploy selectivo (23/Sep/2026, "no se puede hacer deploy solo de lo que
  # se actualiza?") - antes cada push a main construia y desplegaba los 14
  # servicios + frontend sin importar cuantos cambiaron. Compara contra el
  # commit anterior (push a main) que carpetas de servicios/frontend
  # cambiaron; cada job de build/deploy de abajo se salta si su carpeta no
  # esta en esa lista. Un tag de staging o un deploy manual (workflow_dispatch)
  # no tienen un "commit anterior" confiable que comparar - ahi se despliega
  # todo, igual que antes.
  detect-changes:
    name: Detectar cambios por servicio
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.filter.outputs.changes }}
      deploy_all: ${{ steps.modo.outputs.deploy_all }}
    steps:
      - uses: actions/checkout@v4

      - id: modo
        run: echo "deploy_all=${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') }}" >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@v3
        id: filter
        if: steps.modo.outputs.deploy_all == 'false'
        with:
          filters: |
            iam-service: 'services/iam-service/**'
            audit-service: 'services/audit-service/**'
            pld-service: 'services/pld-service/**'
            vivienda-service: 'services/vivienda-service/**'
            compras-tesoreria-service: 'services/compras-tesoreria-service/**'
            rrhh-service: 'services/rrhh-service/**'
            tesoreria-service: 'services/tesoreria-service/**'
            rentas-service: 'services/rentas-service/**'
            document-intelligence-service: 'services/document-intelligence-service/**'
            drive-service: 'services/drive-service/**'
            mail-service: 'services/mail-service/**'
            materiales-service: 'services/materiales-service/**'
            obra-service: 'services/obra-service/**'
            api-gateway: 'services/api-gateway/**'
            frontend: 'frontend/**'

  build-and-push:
    name: Build y push (${{ matrix.service }})
    needs: [detect-changes]
    if: needs.detect-changes.outputs.deploy_all == 'true' || contains(fromJSON(needs.detect-changes.outputs.changes || '[]'), matrix.service)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          [
            iam-service,
            audit-service,
            pld-service,
            vivienda-service,
            compras-tesoreria-service,
            rrhh-service,
            tesoreria-service,
            rentas-service,
            document-intelligence-service,
            drive-service,
            mail-service,
            materiales-service,
            obra-service,
            api-gateway,
          ]
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Autenticar con GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build y push
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ matrix.service }}:${{ github.sha }}"
          docker build -f services/${{ matrix.service }}/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

  build-and-push-frontend:
    name: Build y push (frontend)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.deploy_all == 'true' || contains(fromJSON(needs.detect-changes.outputs.changes || '[]'), 'frontend')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build y push
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/frontend:${{ github.sha }}"
          # 15/Sep/2026: ya no se hornea nada en build time (ver
          # frontend/src/lib/gatewayUrl.ts + next.config.js) - GATEWAY_INTERNAL_URL
          # se pasa como env var de runtime al hacer el deploy, no aqui.
          # 17/Sep/2026: NEXT_PUBLIC_GOOGLE_CLIENT_ID/_PICKER_API_KEY si son
          # build-arg (ver frontend/Dockerfile) - Next.js las hornea en build
          # time, no se pueden pasar como env var de runtime.
          docker build \
            --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_PICKER_CLIENT_ID }}" \
            --build-arg NEXT_PUBLIC_GOOGLE_PICKER_API_KEY="${{ secrets.GOOGLE_PICKER_API_KEY }}" \
            -f frontend/Dockerfile -t "$IMAGE" frontend
          docker push "$IMAGE"

  deploy:
    name: Deploy (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-push]
    # always() porque build-and-push se salta (no falla) para los servicios sin
    # cambios (ver detect-changes arriba) - sin always() ese skip se propagaria
    # aqui y saltaria TODOS los servicios, incluso los que si cambiaron.
    if: |
      always() &&
      needs.build-and-push.result != 'failure' &&
      (needs.detect-changes.outputs.deploy_all == 'true' || contains(fromJSON(needs.detect-changes.outputs.changes || '[]'), matrix.service))
    strategy:
      matrix:
        # api-gateway va al final (deploy-gateway job) porque el resto no
        # depende de el, pero el frontend si depende de su URL final.
        service:
          [
            iam-service,
            audit-service,
            pld-service,
            vivienda-service,
            compras-tesoreria-service,
            rrhh-service,
            tesoreria-service,
            rentas-service,
            document-intelligence-service,
            drive-service,
            mail-service,
            materiales-service,
            obra-service,
          ]
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy a Cloud Run
        run: |
          gcloud run deploy "${{ matrix.service }}-${{ env.ENV_SUFFIX }}" \
            --image "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ matrix.service }}:${{ github.sha }}" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --quiet
        # Env vars (DB_HOST/PASSWORD/etc.), la cuenta de servicio del
        # revision y la conexion de Cloud SQL se configuran UNA SOLA VEZ al
        # crear el servicio (ver scripts/gcp_setup.sh) - este deploy solo
        # actualiza la imagen, no toca esa configuracion cada vez
        # (gcloud run deploy conserva la config existente si no se le pasan
        # esas flags de nuevo).

  deploy-gateway:
    name: Deploy (api-gateway)
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-push, deploy]
    if: |
      always() &&
      needs.build-and-push.result != 'failure' &&
      needs.deploy.result != 'failure' &&
      (needs.detect-changes.outputs.deploy_all == 'true' || contains(fromJSON(needs.detect-changes.outputs.changes || '[]'), 'api-gateway'))
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy a Cloud Run
        run: |
          gcloud run deploy "api-gateway-${{ env.ENV_SUFFIX }}" \
            --image "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/api-gateway:${{ github.sha }}" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --quiet

  deploy-frontend:
    name: Deploy (frontend)
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-push-frontend, deploy-gateway]
    # deploy-gateway se salta seguido (api-gateway no siempre cambia) - eso
    # no debe bloquear el deploy del frontend cuando SI cambio (ver always()
    # arriba, mismo motivo que en deploy/deploy-gateway).
    if: |
      always() &&
      needs.build-and-push-frontend.result != 'failure' &&
      needs.deploy-gateway.result != 'failure' &&
      (needs.detect-changes.outputs.deploy_all == 'true' || contains(fromJSON(needs.detect-changes.outputs.changes || '[]'), 'frontend'))
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy a Cloud Run
        run: |
          gcloud run deploy "frontend-${{ env.ENV_SUFFIX }}" \
            --image "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/frontend:${{ github.sha }}" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --update-env-vars "GATEWAY_INTERNAL_URL=${{ secrets.GATEWAY_URL_DEV }}" \
            --quiet
