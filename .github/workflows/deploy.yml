name: Deploy a Cloud Run

# Pipeline de despliegue (docs/architecture/README.md sec. 4). Separado de
# ci.yml a proposito: CI corre siempre (cada push/PR), esto solo intenta
# desplegar cuando ya paso CI y hay algo real que subir.
#
# Politica de gatillos (segun el diseño original de README.md sec. 4,
# adaptada a un solo proyecto GCP real - cyp-cumbres-461220 - en vez de 3
# proyectos por ambiente, ver docs/architecture/infraestructura-gcp/):
#   - push a main -> despliega a dev (sufijo "-dev" en cada servicio).
#   - tag "vN-faseX" -> despliega a staging (sufijo "-staging").
#   - staging + aprobacion manual (environment protection en GitHub) -> prod.
#
# Requiere que YA EXISTAN (ver scripts/gcp_setup.sh, se corre UNA SOLA VEZ
# a mano por alguien con acceso a gcloud - este workflow no crea infra,
# solo construye/sube/despliega sobre lo que scripts/gcp_setup.sh ya creo):
#   - Artifact Registry: cyp-cumbres-461220/cumbresbi
#   - Workload Identity Federation (WIF) para autenticar GitHub Actions sin
#     llave JSON estatica (mas seguro - ver "Configurar WIF" en el script)
#   - Un service account de despliegue con permisos de
#     roles/run.admin + roles/iam.serviceAccountUser + roles/artifactregistry.writer
#   - Los secrets del repo de GitHub:
#       GCP_PROJECT_ID, GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOY_SA_EMAIL,
#       GCP_REGION, GATEWAY_URL_DEV (para hornear NEXT_PUBLIC_API_BASE_URL
#       del frontend en build time)

on:
  push:
    branches: ["main"]
    tags: ["v*-fase*"]
  workflow_dispatch: {} # permite disparar un deploy manual desde la UI de Actions

permissions:
  contents: read
  id-token: write # requerido por Workload Identity Federation (sin llave JSON)

env:
  REGION: ${{ secrets.GCP_REGION }}
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  AR_REPO: cumbresbi
  # Sufijo de ambiente segun el gatillo - ver politica arriba. workflow_dispatch
  # (deploy manual) tambien va a dev, es el caso mas comun de "probar algo ya".
  ENV_SUFFIX: ${{ (startsWith(github.ref, 'refs/tags/v') && 'staging') || 'dev' }}

jobs:
  build-and-push:
    name: Build y push (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          [
            iam-service,
            audit-service,
            pld-service,
            vivienda-service,
            compras-tesoreria-service,
            rrhh-service,
            tesoreria-service,
            rentas-service,
            document-intelligence-service,
            api-gateway,
          ]
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Autenticar con GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build y push
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ matrix.service }}:${{ github.sha }}"
          docker build -f services/${{ matrix.service }}/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

  build-and-push-frontend:
    name: Build y push (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build y push
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/frontend:${{ github.sha }}"
          # NEXT_PUBLIC_* se hornea en build time (ver frontend/Dockerfile) -
          # tiene que ser la URL real del api-gateway de ESTE ambiente.
          docker build -f frontend/Dockerfile -t "$IMAGE" \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${{ secrets.GATEWAY_URL_DEV }}" \
            frontend
          docker push "$IMAGE"

  deploy:
    name: Deploy (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [build-and-push]
    strategy:
      matrix:
        # api-gateway va al final (deploy-gateway job) porque el resto no
        # depende de el, pero el frontend si depende de su URL final.
        service:
          [
            iam-service,
            audit-service,
            pld-service,
            vivienda-service,
            compras-tesoreria-service,
            rrhh-service,
            tesoreria-service,
            rentas-service,
            document-intelligence-service,
          ]
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy a Cloud Run
        run: |
          gcloud run deploy "${{ matrix.service }}-${{ env.ENV_SUFFIX }}" \
            --image "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ matrix.service }}:${{ github.sha }}" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --quiet
        # Env vars (DB_HOST/PASSWORD/etc.), la cuenta de servicio del
        # revision y la conexion de Cloud SQL se configuran UNA SOLA VEZ al
        # crear el servicio (ver scripts/gcp_setup.sh) - este deploy solo
        # actualiza la imagen, no toca esa configuracion cada vez
        # (gcloud run deploy conserva la config existente si no se le pasan
        # esas flags de nuevo).

  deploy-gateway:
    name: Deploy (api-gateway)
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy]
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy a Cloud Run
        run: |
          gcloud run deploy "api-gateway-${{ env.ENV_SUFFIX }}" \
            --image "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/api-gateway:${{ github.sha }}" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --quiet

  deploy-frontend:
    name: Deploy (frontend)
    runs-on: ubuntu-latest
    needs: [build-and-push-frontend, deploy-gateway]
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy a Cloud Run
        run: |
          gcloud run deploy "frontend-${{ env.ENV_SUFFIX }}" \
            --image "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/frontend:${{ github.sha }}" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --quiet
