# Escalar: cada futuro microservicio (contrapartes-service,
# facturacion-cfdi-service, tickets-service, etc. - ver docs/architecture/
# README.md sec. 1.1) se agrega aqui como un bloque <servicio> + <servicio>-db
# aislado, siguiendo exactamente este mismo patron: su propio Dockerfile bajo
# services/<servicio>/, su propia base de datos con volumen y credenciales
# propias, sin joins directos entre esquemas.

volumes:
  frontend_node_modules:
  iam_db_data:
  audit_db_data:
  pld_db_data:
  vivienda_db_data:
  compras_tesoreria_db_data:
  rrhh_db_data:
  docint_db_data:
  tesoreria_db_data:
  rentas_db_data:
