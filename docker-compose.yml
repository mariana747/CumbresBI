services:
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    restart: unless-stopped
    # --reload (02/Sep/2026, hallazgo real: un cambio de codigo en
    # tesoreria-service no se reflejaba en las respuestas del API hasta un
    # `docker restart` manual) - el volumen ya monta el codigo fuente en
    # vivo, pero gunicorn sin --reload no vuelve a leerlo. Solo aplica en
    # local (docker-compose); el Dockerfile de produccion/Cloud Run se
    # queda sin --reload, ver su propio CMD.
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8080 --workers 2 --reload --reload-engine poll
    env_file:
      - .env
    volumes:
      - ./services/api-gateway:/app
    ports:
      - "8080:8080"

  iam-db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${IAM_DB_NAME:-iam_service}
      MYSQL_USER: ${IAM_DB_USER:-iam_app}
      MYSQL_PASSWORD: ${IAM_DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${IAM_DB_ROOT_PASSWORD:-change-me-root}
    ports:
      - "33061:3306"
    volumes:
      - iam_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${IAM_DB_ROOT_PASSWORD:-change-me-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  iam-service:
    build:
      context: .
      dockerfile: services/iam-service/Dockerfile
    restart: unless-stopped
    # --reload local (ver comentario completo en api-gateway arriba).
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8080 --workers 2 --reload --reload-engine poll
    env_file:
      - .env
    environment:
      IAM_DB_HOST: iam-db
    volumes:
      - ./services/iam-service:/app
    ports:
      - "8000:8080"
    depends_on:
      iam-db:
        condition: service_healthy

  audit-db:
    image: mysql:8.0
    restart: unless-stopped
    # log_bin_trust_function_creators: bitacora_auditoria's append-only triggers
    # (migration 0002) are created by the app DB user, not root/SUPER - MySQL
    # requires this flag to allow trigger creation with binary logging on
    # without granting SUPER to the low-privilege runtime user.
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: ${AUDIT_DB_NAME:-audit_service}
      MYSQL_USER: ${AUDIT_DB_USER:-audit_app}
      MYSQL_PASSWORD: ${AUDIT_DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${AUDIT_DB_ROOT_PASSWORD:-change-me-root}
    ports:
      - "33062:3306"
    volumes:
      - audit_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${AUDIT_DB_ROOT_PASSWORD:-change-me-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

